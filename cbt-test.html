<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAMB CBT Test — SUSU JAMB PREP</title>
<link rel="stylesheet" href="base.css">
</head>
<body data-page="home">
<div class="app">

  <div class="page-header">
    <a class="back-btn" href="index.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div>
      <div class="page-title">JAMB CBT Test</div>
      <div class="page-subtitle">By Year / Random Selection</div>
    </div>
  </div>

  <div class="content-card">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8B6EE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
      By Year
    </div>
    <div class="pill-row">
      <button class="pill purple" data-mode="year" data-value="2024">2024</button>
      <button class="pill purple" data-mode="year" data-value="2023">2023</button>
      <button class="pill purple" data-mode="year" data-value="2022">2022</button>
      <button class="pill purple" data-mode="year" data-value="2021">2021</button>
      <button class="pill purple" data-mode="year" data-value="2020">2020</button>
    </div>
  </div>

  <div class="content-card">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="#EF7B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M7 22l-4-4 4-4"/><path d="M3 6h14M21 18H7"/></svg>
      Random Selection
    </div>
    <p style="font-size:13.5px;color:var(--navy-soft);margin-top:0;">A shuffled 40-question mock across all four subjects, timed like the real exam.</p>
    <button class="btn-primary" id="startRandom">Start Random CBT (40 mins)</button>
  </div>

  <div class="content-card" id="examArea" style="display:none;">
    <div class="section-title" id="examTitle">CBT Session</div>
    <div id="timer" style="font-weight:800;color:var(--green-deep);margin-bottom:10px;">Time left: 40:00</div>
    <p id="examQ" style="font-weight:700;font-size:14.5px;"></p>
    <div id="examOptions"></div>
    <div class="progress-label" style="margin-top:12px;">
      <span>Question <span id="qNum">1</span> / 5</span>
      <span id="qScore">Score: 0</span>
    </div>
    <button class="btn-outline" id="nextQ" style="margin-top:10px;">Next Question</button>
  </div>

</div>

<nav class="bottom-nav">
  <a class="nav-item" data-nav="home" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg>
    <span>Home</span>
  </a>
  <a class="nav-item" data-nav="analysis" href="analysis.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>Analysis</span>
  </a>
  <a class="nav-item" data-nav="chatbot" href="chatbot.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4"/><circle cx="9" cy="14" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="14" r="1.4" fill="currentColor" stroke="none"/><path d="M2 13v3M22 13v3"/></svg>
    <span>Chatbot</span>
  </a>
  <a class="nav-item" data-nav="profile" href="profile.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>
    <span>Profile</span>
  </a>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script src="cbt-test.js"></script>
</body>
</html>
