<div class="app">

  <div class="page-header">
    <a class="back-btn" href="index.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>

    <div>
      <div class="page-title">SUSU Chatbot</div>
      <div class="page-subtitle">Ask anything about JAMB prep</div>
    </div>
  </div>

  <div class="chat-window" id="chatWindow">
    <div class="chat-bubble bot">Hi! I'm your SUSU study assistant. Ask me about a subject, request practice questions, or ask for tips on beating exam anxiety.</div>
  </div>

  <div class="chat-input-row">
    <input type="text" id="chatInput" placeholder="Type your question…" autocomplete="off">
    <button class="chat-send" id="chatSend" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>

</div>
