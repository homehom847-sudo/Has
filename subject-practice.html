  <div class="page-header">
    <a class="back-btn" href="index.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div>
      <div class="page-title">Subject Practice</div>
      <div class="page-subtitle">All Subjects</div>
    </div>
  </div>

  <div class="content-card">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2E6DA4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h8v18l-8-3V4z"/><path d="M20 4h-8v18l8-3V4z"/></svg>
      Choose a subject
    </div>
    <p style="font-size:13.5px;color:var(--navy-soft);margin-top:0;">Pick a subject to practice topic-by-topic questions at your own pace.</p>
    <div class="pill-row" id="subjectList">
      <button class="pill blue" data-subject="English Language">English Language</button>
      <button class="pill purple" data-subject="Mathematics">Mathematics</button>
      <button class="pill" data-subject="Physics">Physics</button>
      <button class="pill peach" data-subject="Chemistry">Chemistry — Full CBT</button>
      <button class="pill yellow" data-subject="Biology">Biology</button>
      <button class="pill blue" data-subject="Government">Government</button>
      <button class="pill purple" data-subject="Economics">Economics</button>
      <button class="pill" data-subject="Literature">Literature-in-English</button>
    </div>
  </div>

  <div class="content-card" id="practiceArea" style="display:none;">
    <div class="section-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1FA766" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
      <span id="practiceSubjectLabel">Practice</span>
    </div>
    <div id="questionBox"></div>
  </div>
