<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Complete Your Profile — SUSU JAMB PREP</title>  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="auth.css">
</head><body data-page="profile-setup">  <div class="auth-wrap"><div class="auth-logo">
  <span style="color:var(--navy);">SUSU</span>
  <span style="color:var(--green);">JAMB</span>
  <span style="color:var(--navy);">PREP</span>
</div>

<div class="auth-tag">
  Complete your profile to start your JAMB prep journey
</div>

<form id="profileSetupForm">

  <!-- PROFILE PICTURE -->
  <div class="field">
    <label for="photo">Profile Picture</label>

    <div id="setupAvatar" class="setup-avatar">
      <span>+</span>
    </div>

    <input
      type="file"
      id="photo"
      accept="image/*"
    >

    <small>
      Choose a clear profile picture. This is optional.
    </small>
  </div>

  <!-- FULL NAME -->
  <div class="field">
    <label for="name">Full Name</label>

    <input
      type="text"
      id="name"
      placeholder="Enter your full name"
      required
    >
  </div>

  <!-- TARGET SCORE -->
  <div class="field">
    <label for="aimedScore">
      Target / Aimed JAMB Score
    </label>

    <input
      type="number"
      id="aimedScore"
      min="0"
      max="400"
      step="1"
      placeholder="e.g. 320"
      required
    >

    <small>
      Enter a score between 0 and 400.
    </small>
  </div>

  <!-- COURSE -->
  <div class="field">
    <label for="course">Preferred Course</label>

    <input
      type="text"
      id="course"
      placeholder="e.g. Medicine and Surgery"
    >
  </div>

  <!-- INSTITUTION -->
  <div class="field">
    <label for="institution">
      Preferred Institution
    </label>

    <input
      type="text"
      id="institution"
      placeholder="e.g. University of Lagos"
    >
  </div>

  <!-- MOTIVATION -->
  <div class="field">
    <label for="whyText">
      Why do you want to score high?
    </label>

    <textarea
      id="whyText"
      rows="4"
      placeholder="Tell us what motivates you..."
    ></textarea>
  </div>

  <!-- ERROR -->
  <div
    class="form-error"
    id="profileSetupError"
  ></div>

  <!-- SUBMIT -->
  <button
    class="btn-primary"
    type="submit"
    id="saveProfileBtn"
  >
    Save Profile & Continue
  </button>

</form>

  </div><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
  <script src="app.js"></script>  <script src="profile-setup.js"></script></body>
</html>
