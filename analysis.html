<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="susu">SUSU</span><span class="jamb">JAMB</span><span class="prep">PREP</span>
    </div>
    <div class="badges">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="#F0AC1B" stroke="#F0AC1B"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7L12 17.3 5.7 20.9l1.7-7L2 9.2l7.1-.6L12 2z"/></svg>

  <div class="content-card">
    <div class="section-title">Performance Overview</div>
    <div class="progress-label"><span>Current Score</span><strong id="curScore">247</strong></div>
    <div class="progress-track"><div class="progress-fill" id="scoreBar" style="width:0%;"></div></div>
    <div class="progress-label"><span>Target Score</span><strong id="tgtScore">320</strong></div>
  </div>

  <div class="content-card">
    <div class="section-title">Accuracy by Subject</div>
    <div id="analysisWeak"></div>
  </div>

  <div class="content-card">
    <div class="section-title">Activity</div>
    <div class="list-row"><span class="label">Questions answered this week</span><span class="meta">186</span></div>
    <div class="list-row"><span class="label">Average session length</span><span class="meta">18 min</span></div>
    <div class="list-row"><span class="label">Current streak</span><span class="meta" id="streakMeta">12 days</span></div>
  </div>

</div>
